<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .image{
        display: grid;
         grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
         gap: 20px;
    }

.image-grid img {
    width: 100%;
    display: block;
}
</style>
<body>
    <div class="image-grid">
        <img src="Image1.jpeg">
        <img src="Image2.jpeg">
        <img src="Image3.jpeg">
        <img src="Image4.jpeg">
    </div>
</body>
</html>
