<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container{
        display: grid;
         grid-template-rows: 100px 200px;
}
       
    
    .table1{
        background-color:rgb(204, 255, 0);
    }
     .table2{
        background-color:aqua;
        transform :scale (1.05);
        box-shadow: 0 5px 5px rgba(0,0,0,0.2);
        position: relative;
    }
     .table3{
        background-color:rgb(166, 0, 255);
    }
    .Popular{
        position: absolute;
        top: -10px;
        right: -5px;
    }
</style>
<body>
    <div class="container">
    <div class="table1">
        <h3>Basic</h3></div>
   
    <div class="table2">
        <span class="Popular">Popular</span>
        <h3>Pro</h3></div>

  
    <div class="table3">
        <h3>Premium</h3></div>

    </div>
</body>
</html>
